[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "traductor-pro"
version = "1.0.0"
description = "Aplicación multiplataforma de traducción de archivos (CFG, LANG, TXT) con múltiples motores"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Handerson"}
]
dependencies = [
    "PyQt5>=5.15",
    "googletrans>=4.0.0-rc1",
    "deepl>=1.16.0",
    "openai>=1.30.0",
    "keyring>=25.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-qt>=4.4",
    "flake8>=7.0",
    "mypy>=1.10",
    "black>=24.4",
    "isort>=5.13",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.isort]
profile = "black"
line_length = 100
